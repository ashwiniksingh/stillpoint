<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillpoint</title>
<meta name="description" content="A random Buddha quote every time you open it, plus Marcus Aurelius, Seneca and Epictetus.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stillpoint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f2ee;
  --surface: #e8eae4;
  --fg: #1c2320;
  --muted: #5d6762;
  --line: #cfd3cb;
  --accent: #9a6a12;
  --accent-fg: #ffffff;
  --font-quote: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101412; --surface: #161b18; --fg: #e8ebe6; --muted: #9aa49e; --line: #2c3430; --accent: #e0a94a; --accent-fg: #14110a; }
}
/* Each voice has its own accent */
body[data-voice="Marcus Aurelius"] { --accent: #35597a; }
body[data-voice="Seneca"] { --accent: #4a6b3a; }
body[data-voice="Epictetus"] { --accent: #7a4a70; }
@media (prefers-color-scheme: dark) {
  body[data-voice="Marcus Aurelius"] { --accent: #86b0d6; }
  body[data-voice="Seneca"] { --accent: #a3c78f; }
  body[data-voice="Epictetus"] { --accent: #d3a1c8; }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}

/* Header */
header {
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.mark { width: 26px; height: 26px; color: var(--accent); flex: none; transition: color .3s ease; }
.wordmark {
  margin: 0;
  font-family: var(--font-quote);
  font-weight: 500;
  font-size: 19px;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  margin-right: -0.42em;
}

main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding-block: 28px 24px; max-width: 640px; width: 100%; margin: 0 auto; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
figure { margin: 0; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
blockquote { margin: 0; font-family: var(--font-quote); font-weight: 400; font-size: clamp(26px, 7.2vw, 38px); line-height: 1.28; text-wrap: balance; overflow-wrap: anywhere; transition: opacity .35s ease, transform .35s ease; }
figcaption { display: flex; flex-direction: column; gap: 3px; transition: opacity .35s ease; }
.who { font-weight: 600; font-size: 15px; }
.src { font-size: 13px; color: var(--muted); }
figure.swap blockquote { opacity: 0; transform: translateY(6px); }
figure.swap figcaption { opacity: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 600 15px var(--font-ui); border-radius: 12px; padding: 14px 20px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); flex: 1 1 160px; }
.btn.ghost { background: transparent; color: var(--accent); }
.note { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0; }

/* Bottom: names to pick from */
.voices {
  background: var(--surface);
  border-top: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.voices-label { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.voices-row { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 2px; }
.voice {
  font: 500 15px var(--font-quote);
  color: var(--muted);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 10px 0 8px;
  cursor: pointer;
}
.voice[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { blockquote, figcaption, .mark { transition: none; } }
</style>
</head>
<body data-voice="Buddha">

<header>
  <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
    <circle cx="16" cy="16" r="14" stroke-width="1" opacity=".35"/>
    <circle cx="16" cy="16" r="9" stroke-width="1.2" opacity=".6"/>
    <circle cx="16" cy="16" r="4" fill="currentColor" stroke="none"/>
  </svg>
  <h1 class="wordmark">Stillpoint</h1>
</header>

<main>
  <p class="eyebrow" id="eyebrow"></p>
  <figure id="fig" aria-live="polite">
    <blockquote id="q"></blockquote>
    <figcaption><span class="who" id="who"></span><span class="src" id="src"></span></figcaption>
  </figure>
  <div class="actions">
    <button class="btn primary" id="next" type="button">Another quote</button>
    <button class="btn ghost" id="copy" type="button">Copy</button>
  </div>
  <p class="note">Wording follows public-domain translations (Müller, Long, Gummere), lightly modernized in places. Translations differ, so check the cited passage if you plan to quote it.</p>
</main>

<div class="voices">
  <p class="voices-label">Choose a voice</p>
  <div class="voices-row" id="voices" role="group" aria-label="Choose a voice"></div>
</div>

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
