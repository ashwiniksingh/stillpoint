<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillpoint</title>
<meta name="description" content="A random Buddha quote every time you open it, plus Marcus Aurelius and other Stoics.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stillpoint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f1f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f2ee;
  --surface: #e6e8e2;
  --fg: #1c2320;
  --muted: #5d6762;
  --line: #cfd3cb;
  --accent: #9a6a12;
  --accent-fg: #ffffff;
  --font-quote: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101412; --surface: #1a201d; --fg: #e8ebe6; --muted: #9aa49e; --line: #2c3430; --accent: #e0a94a; --accent-fg: #14110a; }
}
body[data-tab="stoic"] { --accent: #35597a; }
@media (prefers-color-scheme: dark) { body[data-tab="stoic"] { --accent: #86b0d6; } }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
}
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding-block: 24px 120px; max-width: 640px; width: 100%; margin: 0 auto; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips[hidden] { display: none; }
.chip { font: 500 13px var(--font-ui); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
figure { margin: 0; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
blockquote { margin: 0; font-family: var(--font-quote); font-weight: 400; font-size: clamp(26px, 7.2vw, 38px); line-height: 1.28; text-wrap: balance; overflow-wrap: anywhere; transition: opacity .35s ease, transform .35s ease; }
figcaption { display: flex; flex-direction: column; gap: 3px; transition: opacity .35s ease; }
.who { font-weight: 600; font-size: 15px; }
.src { font-size: 13px; color: var(--muted); }
figure.swap blockquote { opacity: 0; transform: translateY(6px); }
figure.swap figcaption { opacity: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 600 15px var(--font-ui); border-radius: 12px; padding: 14px 20px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); flex: 1 1 160px; }
.btn.ghost { background: transparent; color: var(--accent); }
.note { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.tab { flex: 1; font: 600 14px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-radius: 10px; padding: 12px 8px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent-fg); background: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { blockquote, figcaption { transition: none; } }
</style>
</head>
<body data-tab="buddha">

<main>
  <p class="eyebrow" id="eyebrow"></p>
  <div class="chips" id="chips" role="group" aria-label="Filter by philosopher" hidden></div>
  <figure id="fig" aria-live="polite">
    <blockquote id="q"></blockquote>
    <figcaption><span class="who" id="who"></span><span class="src" id="src"></span></figcaption>
  </figure>
  <div class="actions">
    <button class="btn primary" id="next" type="button">Another quote</button>
    <button class="btn ghost" id="copy" type="button">Copy</button>
  </div>
  <p class="note">Wording follows public-domain translations (Müller, Long, Gummere), lightly modernized in places. Translations differ, so check the cited passage if you plan to quote it.</p>
</main>

<nav role="tablist" aria-label="Collections">
  <button class="tab" role="tab" id="tab-buddha" data-tab="buddha" type="button">Buddha</button>
  <button class="tab" role="tab" id="tab-stoic" data-tab="stoic" type="button">Stoics</button>
</nav>

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
